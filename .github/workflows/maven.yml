name: CI — Build & Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build and Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run all tests
        run: mvn clean package --batch-mode --no-transfer-progress

      - name: Verify agent JAR exists
        run: |
          ls -lh target/sentinel-agent.jar
          jar tf target/sentinel-agent.jar | grep "META-INF/MANIFEST.MF"

      - name: Inspect MANIFEST.MF
        run: |
          jar xf target/sentinel-agent.jar META-INF/MANIFEST.MF
          cat META-INF/MANIFEST.MF

      - name: Run demo WITHOUT agent
        run: |
          echo "=== Without Agent ==="
          java -jar target/sentinel-agent.jar

      - name: Run demo WITH agent
        run: |
          echo "=== With Agent ==="
          java -javaagent:target/sentinel-agent.jar -jar target/sentinel-agent.jar

      - name: Upload sentinel-agent.jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-agent-jar
          path: target/sentinel-agent.jar
          retention-days: 30
